<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Smart Earn</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; background: #f4f7fe; }
        #sidebar { width: 250px; background: #0f172a; color: white; height: 100vh; padding: 20px; box-sizing: border-box; }
        #main { flex: 1; padding: 20px; overflow-y: auto; height: 100vh; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { padding: 8px 15px; border: none; cursor: pointer; border-radius: 4px; color: white; margin-right: 5px; }
        .btn-green { background: #10b981; } .btn-red { background: #ef4444; } .btn-blue { background: #3b82f6; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        .hidden { display: none; }
        input { padding: 5px; border: 1px solid #ccc; width: 60%; }
        
        /* Modal for Viewing Links */
        #linkModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
        #modalContent { background: white; width: 50%; padding: 20px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
    </style>
</head>
<body>

<div id="loginBox" style="margin: 100px auto; text-align: center; width: 300px;">
    <h2>Admin Login</h2>
    <input id="aEmail" placeholder="Email" style="width:100%; margin-bottom:10px;"><br>
    <input id="aPass" type="password" placeholder="Password" style="width:100%; margin-bottom:10px;"><br>
    <button class="btn btn-blue" onclick="adminLogin()">Login</button>
</div>

<div id="adminPanel" class="hidden" style="width: 100%; display: flex;">
    <div id="sidebar">
        <h3>Smart Admin</h3>
        <p onclick="showSec('secTasks')" style="cursor:pointer">Manage Tasks</p>
        <p onclick="showSec('secPromo')" style="cursor:pointer">Approvals</p>
        <p onclick="showSec('secUsers')" style="cursor:pointer">User Links</p>
        <p onclick="showSec('secWithdraw')" style="cursor:pointer">Withdrawals</p>
        <button class="btn btn-red" onclick="location.reload()">Logout</button>
    </div>
    
    <div id="main">
        <div id="secTasks" class="section">
            <div class="card">
                <h3>Set Video Tasks (Slots 1-10)</h3>
                <div id="videoSlotsContainer"></div>
            </div>
        </div>

        <div id="secPromo" class="section hidden">
            <div class="card">
                <h3>Package Approvals</h3>
                <table><thead><tr><th>Email</th><th>Package</th><th>TRX</th><th>Action</th></tr></thead><tbody id="promoTable"></tbody></table>
            </div>
        </div>

        <div id="secUsers" class="section hidden">
            <div class="card">
                <h3>Users & Viral Links</h3>
                <table><thead><tr><th>Email</th><th>Action</th></tr></thead><tbody id="usersTable"></tbody></table>
            </div>
        </div>

        <div id="secWithdraw" class="section hidden">
            <div class="card">
                <h3>Withdraw Requests</h3>
                <table><thead><tr><th>Email</th><th>Amount</th><th>Number</th><th>Action</th></tr></thead><tbody id="withdrawTable"></tbody></table>
            </div>
        </div>
    </div>
</div>

<div id="linkModal">
    <div id="modalContent">
        <h3>User Submitted Links</h3>
        <div id="linksList"></div>
        <button class="btn btn-red" onclick="document.getElementById('linkModal').style.display='none'" style="margin-top:20px;">Close</button>
    </div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ", authDomain: "own-live-steam-web.firebaseapp.com", projectId: "own-live-steam-web", databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", messagingSenderId: "132045886996", appId: "1:132045886996:web:8a6d937c3548afd2477901" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), rtdb = firebase.database();

function adminLogin() {
    auth.signInWithEmailAndPassword(document.getElementById("aEmail").value, document.getElementById("aPass").value)
    .then(() => {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        loadAllData();
    }).catch(e => alert(e.message));
}

function showSec(id) {
    document.querySelectorAll('.section').forEach(d => d.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

function loadAllData() {
    // 1. Load Slots
    const vDiv = document.getElementById("videoSlotsContainer");
    for(let i=1; i<=10; i++) {
        vDiv.innerHTML += `<div style="margin-bottom:10px;">Slot ${i}: <input id="v${i}" placeholder="Link"><button class="btn btn-blue" onclick="saveTask(${i})">Save</button></div>`;
    }

    // 2. Load Promos
    rtdb.ref('promotionRequests').on('value', snap => {
        const t = document.getElementById("promoTable"); t.innerHTML = "";
        snap.forEach(c => {
            const v = c.val();
            t.innerHTML += `<tr><td>${v.email}</td><td>${v.package}</td><td>${v.trxId}</td><td><button class="btn btn-green" onclick="approve('${c.key}','${v.uid}','${v.package}')">Approve</button></td></tr>`;
        });
    });

    // 3. Load Users for Links
    rtdb.ref('users').on('value', snap => {
        const t = document.getElementById("usersTable"); t.innerHTML = "";
        snap.forEach(c => {
            t.innerHTML += `<tr><td>${c.val().email}</td><td><button class="btn btn-blue" onclick="viewLinks('${c.key}')">View Viral Links</button></td></tr>`;
        });
    });

    // 4. Withdrawals
    rtdb.ref('withdrawRequests').on('value', snap => {
        const t = document.getElementById("withdrawTable"); t.innerHTML = "";
        snap.forEach(c => {
            const v = c.val();
            if(v.status==='pending') t.innerHTML += `<tr><td>${v.email}</td><td>${v.amount}</td><td>${v.number}</td><td><button class="btn btn-green" onclick="payOut('${c.key}')">Done</button></td></tr>`;
        });
    });
}

function saveTask(i) {
    db.collection("videos").doc("slot"+i).set({ slot:i, link:document.getElementById("v"+i).value, enabled:true }).then(()=>alert("Saved"));
}

function approve(key, uid, pkg) {
    const d = new Date(); d.setDate(d.getDate() + 30);
    rtdb.ref('activeSubscriptions/'+uid).set({ package:pkg, expiryDate:d.toISOString(), status:'active' });
    rtdb.ref('promotionRequests/'+key).remove();
    alert("Approved! User can now see Promote Option.");
}

function viewLinks(uid) {
    document.getElementById("linkModal").style.display = "flex";
    const list = document.getElementById("linksList");
    list.innerHTML = "Fetching...";
    
    rtdb.ref('userSubmittedLinks/'+uid).on('value', snap => {
        list.innerHTML = "";
        const data = snap.val();
        if(!data) { list.innerHTML = "No links found."; return; }
        
        ['video', 'channel'].forEach(type => {
            if(data[type+'s']) {
                Object.keys(data[type+'s']).forEach(k => {
                    const item = data[type+'s'][k];
                    list.innerHTML += `<div style="background:#f9f9f9; border:1px solid #ddd; padding:10px; margin-bottom:5px;">
                        <strong>${type.toUpperCase()}:</strong> <a href="${item.url}" target="_blank">${item.url}</a><br>
                        Status: ${item.status}<br>
                        <button class="btn btn-green" onclick="updateStatus('${uid}','${type}s','${k}','Task Added')">Mark as Added</button>
                    </div>`;
                });
            }
        });
    });
}

function updateStatus(uid, type, key, status) {
    rtdb.ref(`userSubmittedLinks/${uid}/${type}/${key}`).update({ status: status });
    alert("Status Updated");
}

function payOut(key) {
    rtdb.ref('withdrawRequests/'+key).update({ status: 'paid' });
}
</script>
</body>
</html>
