<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Earn - Admin Control Center</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1976d2; --dark: #0f172a; --sidebar-w: 240px; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f7fe; display: flex; }
        #sidebar { width: var(--sidebar-w); background: var(--dark); color: white; height: 100vh; position: fixed; overflow-y: auto; }
        .nav-link { display: block; padding: 15px 20px; color: #cbd5e1; text-decoration: none; border-bottom: 1px solid #1e293b; transition: 0.3s; cursor: pointer; }
        .nav-link:hover { background: #1e293b; color: white; }
        #main-content { margin-left: var(--sidebar-w); flex: 1; padding: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #edf2f7; font-size: 14px; }
        th { background: #f8fafc; color: #64748b; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; margin-right: 5px; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <div style="padding: 20px; text-align: center; border-bottom: 1px solid #1e293b;">
        <h3 style="margin: 0; color: #3b82f6;">Smart Admin</h3>
    </div>
    <a class="nav-link" onclick="showSection('usersSection')"><i class="fas fa-users"></i> Manage Users</a>
    <a class="nav-link" onclick="showSection('promoSection')"><i class="fas fa-rocket"></i> Promo Requests</a>
    <a class="nav-link" onclick="showSection('contentSection')"><i class="fas fa-tasks"></i> User Submissions</a>
    <a class="nav-link" onclick="showSection('videoSection')"><i class="fas fa-play-circle"></i> Video Tasks</a>
    <a class="nav-link" onclick="showSection('withdrawSection')"><i class="fas fa-wallet"></i> Withdrawals</a>
</div>

<div id="main-content">
    <section id="usersSection" class="section">
        <div class="card">
            <h2>Registered Users</h2>
            <table>
                <thead><tr><th>Name/Email</th><th>Watch</th><th>Subs</th><th>Balance</th><th>Action</th></tr></thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </section>

    <section id="promoSection" class="section hidden">
        <div class="card">
            <h2>Promotion Requests</h2>
            <table>
                <thead><tr><th>User Email</th><th>Package</th><th>TRX ID</th><th>Action</th></tr></thead>
                <tbody id="promoListBody"></tbody>
            </table>
        </div>
    </section>

    <section id="contentSection" class="section hidden">
        <div class="card">
            <h2>User Submissions (Videos/Channels)</h2>
            <div id="submissionListBody"></div>
        </div>
    </section>

    <section id="videoSection" class="section hidden">
        <div class="card">
            <h2>Manage Video Tasks</h2>
            <div id="videoInputs"></div>
        </div>
    </section>

    <section id="withdrawSection" class="section hidden">
        <div class="card">
            <h2>Withdrawal Requests</h2>
            <table>
                <thead><tr><th>User</th><th>Amount</th><th>Details</th><th>Action</th></tr></thead>
                <tbody id="withdrawList"></tbody>
            </table>
        </div>
    </section>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ", authDomain: "own-live-steam-web.firebaseapp.com", projectId: "own-live-steam-web", databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", messagingSenderId: "132045886996", appId: "1:132045886996:web:8a6d937c3548afd2477901" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), rtdb = firebase.database();

function showSection(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

// 1. Load Users
rtdb.ref('users').on('value', snap => {
    const body = document.getElementById("userTableBody"); body.innerHTML = "";
    snap.forEach(child => {
        const u = child.val();
        const bal = ((u.watch||0)*0.38 + (u.subPoints||0)*0.60 + (u.bonus||0) - (u.withdrawnAmount||0)).toFixed(2);
        body.innerHTML += `<tr>
            <td>${u.email}</td><td>${u.watch||0}</td><td>${u.subPoints||0}</td><td>Rs ${bal}</td>
            <td>
                <button class="btn btn-blue" onclick="editPassword('${child.key}')">Pass</button>
                <button class="btn btn-red" onclick="deleteUser('${child.key}')">Del</button>
            </td>
        </tr>`;
    });
});

// 2. Load Promotion Requests (Fixed Approval Logic)
rtdb.ref('promotionRequests').on('value', snap => {
    const body = document.getElementById("promoListBody"); body.innerHTML = "";
    snap.forEach(child => {
        const p = child.val();
        if(p.status === 'pending') {
            body.innerHTML += `<tr>
                <td>${p.email}</td><td>${p.package}</td><td>${p.trx || 'N/A'}</td>
                <td>
                    <button class="btn btn-green" onclick="approvePromotion('${child.key}', '${p.uid}', '${p.package}')">Approve & Activate</button>
                </td>
            </tr>`;
        }
    });
});

// CRITICAL FIX: Approval function jo user side sidebar button on karega
function approvePromotion(reqId, uid, pkgName) {
    const expiry = new Date();
    expiry.setDate(expiry.getDate() + 30); // 30 Days expiry
    
    // Step 1: Add to activeSubscriptions (This triggers User Sidebar)
    rtdb.ref('activeSubscriptions/' + uid).set({
        package: pkgName,
        expiryDate: expiry.toLocaleDateString(),
        status: 'active',
        approvedAt: new Date().toLocaleString()
    }).then(() => {
        // Step 2: Update request status
        rtdb.ref('promotionRequests/' + reqId).update({ status: 'approved' });
        
        // Step 3: Add bonus subPoints to user as a reward
        rtdb.ref('users/' + uid).once('value', s => {
            const current = s.val().subPoints || 0;
            rtdb.ref('users/' + uid).update({ subPoints: current + 1 });
        });
        
        alert("Approved! User can now see 'My Promotion Hub'");
    }).catch(err => alert(err.message));
}

// 3. User Submissions
rtdb.ref('userSubmittedLinks').on('value', snap => {
    const body = document.getElementById("submissionListBody"); body.innerHTML = "";
    snap.forEach(userSnap => {
        const uid = userSnap.key;
        const links = userSnap.val();
        body.innerHTML += `<div style="background:#f8fafc; padding:10px; margin-top:10px; border-radius:8px;"><strong>User: ${uid}</strong></div>`;
        ['video', 'channel'].forEach(type => {
            if(links[type+'s']) {
                Object.keys(links[type+'s']).forEach(linkKey => {
                    const item = links[type+'s'][linkKey];
                    body.innerHTML += `<div style="padding:10px; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; align-items:center;">
                        <span>${item.url} (${type})</span>
                        <button class="btn btn-blue" onclick="toggleSubmissionStatus('${uid}', '${type}s', '${linkKey}', '${item.status}')">${item.status}</button>
                    </div>`;
                });
            }
        });
    });
});

function toggleSubmissionStatus(uid, typePath, key, current) {
    const next = current === 'pending' ? 'Task Added' : 'pending';
    rtdb.ref(`userSubmittedLinks/${uid}/${typePath}/${key}`).update({ status: next });
}

// 4. Manage Video Tasks
for(let i=1; i<=10; i++) {
    document.getElementById("videoInputs").innerHTML += `<div class="card">
        Slot ${i}: <input id="v${i}" placeholder="Video URL" style="width:70%; padding:5px;">
        <button class="btn btn-green" onclick="saveV(${i})">Save</button>
    </div>`;
    db.collection("videos").doc("slot"+i).get().then(d => { if(d.exists()) document.getElementById("v"+i).value = d.data().link; });
}

function saveV(n) {
    db.collection("videos").doc("slot"+n).set({ slot: n, link: document.getElementById("v"+n).value, enabled: true })
    .then(() => alert("Video Saved"));
}

// 5. Withdrawals
rtdb.ref('withdrawRequests').on('value', snap => {
    const body = document.getElementById("withdrawList"); body.innerHTML = "";
    snap.forEach(child => {
        const r = child.val();
        if(r.status === 'pending') {
            body.innerHTML += `<tr>
                <td>${r.email}</td><td>Rs ${r.amount}</td><td>${r.details || ''}</td>
                <td><button class="btn btn-green" onclick="approveWithdraw('${child.key}')">Paid</button></td>
            </tr>`;
        }
    });
});

function approveWithdraw(key) { rtdb.ref('withdrawRequests/'+key).update({ status: 'Approved' }).then(() => alert("Paid!")); }

function editPassword(uid) { const p = prompt("New Password:"); if(p) rtdb.ref('users/'+uid).update({password:p}); }
function deleteUser(uid) { if(confirm("Delete User?")) rtdb.ref('users/'+uid).remove(); }

showSection('usersSection');
</script>
</body>
</html>
