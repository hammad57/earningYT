<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Control Center</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body{margin:0;font-family:Arial, sans-serif;background:#eef1f5}
        header{background:#000;color:#fff;padding:15px;text-align:center;font-size:20px}
        .container{padding:20px; max-width: 1100px; margin: auto;}
        .card{background:#fff;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
        table{width:100%;border-collapse:collapse;margin-top:15px;background:#fff; font-size: 14px;}
        th,td{border:1px solid #ddd;padding:10px;text-align:center}
        th{background:#f8f9fa}
        .approve-btn{background:#28a745; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:12px}
        .btn-red{background:#dc3545; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer;}
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="authBox" style="text-align: center; margin-top: 100px;">
    <h2>Admin Login</h2>
    <input type="email" id="adminEmail" placeholder="Admin Email" style="padding:10px; width:250px;"><br><br>
    <input type="password" id="adminPass" placeholder="Password" style="padding:10px; width:250px;"><br><br>
    <button onclick="adminLogin()" style="padding:10px 40px; background:#000; color:#fff; border:none; cursor:pointer;">Login</button>
</div>

<div id="adminContent" class="hidden">
    <header>Admin Control Panel</header>
    <div class="container">
        <div class="card">
            <h3>Withdrawal Requests (Pending)</h3>
            <table>
                <thead>
                    <tr><th>User Email</th><th>Real Amount</th><th>Payout (+Bonus)</th><th>Action</th></tr>
                </thead>
                <tbody id="withdrawList"><tr><td colspan="4">No pending requests</td></tr></tbody>
            </table>
        </div>

        <div class="card">
            <h3>Registered Users</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Watch Pts</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="usersList"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ",
  authDomain: "own-live-steam-web.firebaseapp.com",
  projectId: "own-live-steam-web",
  databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const rtdb = firebase.database();

function adminLogin() {
    auth.signInWithEmailAndPassword(adminEmail.value, adminPass.value).catch(err => alert(err.message));
}

auth.onAuthStateChanged(user => {
    if(user) {
        document.getElementById("authBox").classList.add("hidden");
        document.getElementById("adminContent").classList.remove("hidden");
        loadUsers();
        loadWithdrawals();
    }
});

function loadUsers() {
    rtdb.ref('users').on('value', snap => {
        const list = document.getElementById("usersList");
        list.innerHTML = "";
        snap.forEach(child => {
            const u = child.val();
            const uid = child.key;
            list.innerHTML += `<tr>
                <td>${u.name || 'User'}</td>
                <td>${u.email}</td>
                <td>${u.watch || 0}</td>
                <td>${u.status || 'active'}</td>
                <td>
                    <button onclick="toggleUser('${uid}', '${u.status}')">Toggle Status</button>
                    <button class="btn-red" onclick="deleteUser('${uid}')">Delete</button>
                </td>
            </tr>`;
        });
    });
}

function loadWithdrawals() {
    rtdb.ref('withdrawRequests').on('value', snap => {
        const list = document.getElementById("withdrawList");
        list.innerHTML = "";
        snap.forEach(child => {
            const req = child.val();
            if(req.status === "pending") {
                list.innerHTML += `<tr>
                    <td>${req.email}</td>
                    <td>Rs. ${req.amount.toFixed(2)}</td>
                    <td><strong>Rs. ${req.payout.toFixed(2)}</strong></td>
                    <td>
                        <button class="approve-btn" onclick="updateWithdraw('${child.key}', 'Approved')">Approve</button>
                        <button class="btn-red" onclick="updateWithdraw('${child.key}', 'Rejected')">Reject</button>
                    </td>
                </tr>`;
            }
        });
    });
}

function updateWithdraw(id, status) {
    rtdb.ref('withdrawRequests/' + id).update({ status: status }).then(() => alert("Request " + status));
}

function toggleUser(uid, s) {
    let ns = (s === 'disabled') ? 'active' : 'disabled';
    rtdb.ref('users/' + uid).update({ status: ns });
}

function deleteUser(uid) {
    if(confirm("Delete this user?")) rtdb.ref('users/' + uid).remove();
}
</script>
</body>
</html>
