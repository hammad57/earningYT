<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Earn - Admin Control Center</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1976d2; --dark: #0f172a; --sidebar-w: 240px; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f7fe; display: flex; }
        #sidebar { width: var(--sidebar-w); background: var(--dark); color: white; height: 100vh; position: fixed; overflow-y: auto; }
        .nav-link { padding: 15px 20px; display: block; color: #cbd5e1; text-decoration: none; border-bottom: 1px solid #1e293b; }
        #main { flex: 1; margin-left: var(--sidebar-w); padding: 20px; width: calc(100% - var(--sidebar-w)); }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .grid-task { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .task-box { border: 1px solid #ddd; padding: 10px; border-radius: 8px; }
        .btn { padding: 8px 12px; border-radius: 6px; cursor: pointer; border: none; font-size: 11px; font-weight: bold; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .hidden { display: none !important; }
        input { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        #modal { position: fixed; top: 10%; left: 30%; width: 40%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 0 50px rgba(0,0,0,0.5); z-index: 2000; }
    </style>
</head>
<body>

<div id="authBox" style="max-width:350px; margin:100px auto; text-align:center; background:white; padding:30px; border-radius:15px;">
    <h2>Admin Login</h2>
    <input type="email" id="aEmail" placeholder="Email"><br>
    <input type="password" id="aPass" placeholder="Password"><br>
    <button class="btn btn-green" style="width:100%" onclick="auth.signInWithEmailAndPassword(aEmail.value, aPass.value)">Login</button>
</div>

<div id="adminContent" class="hidden">
    <div id="sidebar">
        <div style="padding:20px; text-align:center; font-weight:bold;">SMART ADMIN</div>
        <a href="#tasks" class="nav-link">Video/Channel Tasks</a>
        <a href="#promos" class="nav-link">Promotion Requests</a>
        <a href="#users" class="nav-link">User Management</a>
        <a href="#withdraw" class="nav-link">Withdrawals</a>
        <div style="padding:20px;"><button onclick="auth.signOut()" class="btn btn-red" style="width:100%">Logout</button></div>
    </div>

    <div id="main">
        <section id="tasks" class="card">
            <h3>Manage Platform Tasks</h3>
            <h4>Video Slots (1-10)</h4>
            <div class="grid-task" id="videoSlots"></div>
            <h4 style="margin-top:20px;">Channel Slots (1-5)</h4>
            <div class="grid-task" id="channelSlots"></div>
        </section>

        <section id="promos" class="card">
            <h3>Pending Promotion Orders</h3>
            <table style="width:100%; border-collapse:collapse;">
                <thead><tr><th>User</th><th>Package</th><th>TRX</th><th>Action</th></tr></thead>
                <tbody id="promoList"></tbody>
            </table>
        </section>

        <section id="users" class="card">
            <h3>User List (Viral Requests)</h3>
            <table style="width:100%; border-collapse:collapse;">
                <thead><tr><th>Email</th><th>Balance</th><th>Links</th></tr></thead>
                <tbody id="usersList"></tbody>
            </table>
        </section>

        <section id="withdraw" class="card">
            <h3>Pending Withdrawals</h3>
            <table style="width:100%; border-collapse:collapse;">
                <tbody id="withdrawList"></tbody>
            </table>
        </section>
    </div>
</div>

<div id="modal" class="hidden">
    <h3 id="modalTitle">Submitted Viral Links</h3>
    <div id="modalBody" style="max-height:300px; overflow-y:auto; margin-bottom:15px;"></div>
    <button class="btn btn-red" onclick="document.getElementById('modal').classList.add('hidden')">Close Window</button>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ", authDomain: "own-live-steam-web.firebaseapp.com", projectId: "own-live-steam-web", databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", messagingSenderId: "132045886996", appId: "1:132045886996:web:8a6d937c3548afd2477901" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), rtdb = firebase.database();

auth.onAuthStateChanged(u => {
    if(u) {
        document.getElementById("authBox").classList.add("hidden");
        document.getElementById("adminContent").classList.remove("hidden");
        initTaskSlots(); loadPromos(); loadUsers(); loadWithdrawRequests();
    } else {
        document.getElementById("authBox").classList.remove("hidden");
        document.getElementById("adminContent").classList.add("hidden");
    }
});

// Restore Task Slots logic
function initTaskSlots() {
    const vContainer = document.getElementById("videoSlots"); vContainer.innerHTML = "";
    for(let i=1; i<=10; i++) {
        vContainer.innerHTML += `<div class="task-box">
            Slot ${i} <input id="v${i}" placeholder="YouTube Link">
            <button class="btn btn-blue" onclick="saveV(${i})">Save</button>
        </div>`;
        db.collection("videos").doc("slot"+i).get().then(s => { if(s.exists) document.getElementById("v"+i).value = s.data().link; });
    }
    const cContainer = document.getElementById("channelSlots"); cContainer.innerHTML = "";
    for(let i=1; i<=5; i++) {
        cContainer.innerHTML += `<div class="task-box">
            Chan ${i} <input id="c${i}" placeholder="Channel Link">
            <button class="btn btn-blue" onclick="saveC(${i})">Save</button>
        </div>`;
        db.collection("channels").doc("chan"+i).get().then(s => { if(s.exists) document.getElementById("c"+i).value = s.data().link; });
    }
}
function saveV(n){ db.collection("videos").doc("slot"+n).set({slot:n, link:document.getElementById("v"+n).value, enabled:true}).then(()=>alert("Saved")); }
function saveC(n){ db.collection("channels").doc("chan"+n).set({slot:n, link:document.getElementById("c"+n).value, enabled:true}).then(()=>alert("Saved")); }

function loadPromos() {
    rtdb.ref('promotionRequests').on('value', snap => {
        const list = document.getElementById("promoList"); list.innerHTML = "";
        snap.forEach(child => {
            const r = child.val();
            list.innerHTML += `<tr>
                <td>${r.email}</td><td>${r.package}</td><td>${r.trxId}</td>
                <td>
                    <button class="btn btn-green" onclick="approvePromo('${child.key}', '${r.uid}', '${r.package}')">Approve</button>
                    <button class="btn btn-red" onclick="rtdb.ref('promotionRequests/${child.key}').remove()">Reject</button>
                </td>
            </tr>`;
        });
    });
}

function approvePromo(key, uid, pkg) {
    const expiry = new Date(); expiry.setDate(expiry.getDate() + 30);
    // When approved, this enables the "Promote YT Channel" button on user side
    rtdb.ref('activeSubscriptions/' + uid).set({ package: pkg, expiryDate: expiry.toISOString(), status: 'active' });
    rtdb.ref('promotionRequests/' + key).remove().then(() => alert("Approved! User can now submit viral links."));
}

function loadUsers() {
    rtdb.ref('users').on('value', snap => {
        const list = document.getElementById("usersList"); list.innerHTML = "";
        snap.forEach(child => {
            const u = child.val();
            list.innerHTML += `<tr><td>${u.email}</td><td>Rs ${u.bonus||0}</td>
            <td><button class="btn btn-blue" onclick="viewUserLinks('${child.key}')">View Viral Requests</button></td></tr>`;
        });
    });
}

function viewUserLinks(uid) {
    const modal = document.getElementById("modal");
    const body = document.getElementById("modalBody");
    modal.classList.remove("hidden");
    body.innerHTML = "Fetching user links...";
    
    rtdb.ref('userSubmittedLinks/' + uid).on('value', snap => {
        const data = snap.val(); body.innerHTML = "";
        if(!data) { body.innerHTML = "<p>No viral links submitted by this user.</p>"; return; }
        
        // Videos
        if(data.videos) {
            body.innerHTML += "<h4>Submitted Videos:</h4>";
            Object.keys(data.videos).forEach(key => {
                const item = data.videos[key];
                body.innerHTML += `<div style="border-bottom:1px solid #ddd; padding:8px; margin-bottom:5px; background:#f9f9f9;">
                    <a href="${item.url}" target="_blank" style="font-size:11px; color:blue;">${item.url}</a><br>
                    <span style="font-size:10px; color:#666">Status: ${item.status}</span><br>
                    <button class="btn btn-green" onclick="copyToClipboard('${item.url}')">Copy Link</button>
                    <button class="btn btn-blue" onclick="toggleLinkStatus('${uid}', 'videos', '${key}', '${item.status}')">Toggle Status</button>
                </div>`;
            });
        }
        // Channels
        if(data.channels) {
            body.innerHTML += "<h4>Submitted Channels:</h4>";
            Object.keys(data.channels).forEach(key => {
                const item = data.channels[key];
                body.innerHTML += `<div style="border-bottom:1px solid #ddd; padding:8px; margin-bottom:5px; background:#f9f9f9;">
                    <a href="${item.url}" target="_blank" style="font-size:11px; color:blue;">${item.url}</a><br>
                    <span style="font-size:10px; color:#666">Status: ${item.status}</span><br>
                    <button class="btn btn-green" onclick="copyToClipboard('${item.url}')">Copy Link</button>
                    <button class="btn btn-blue" onclick="toggleLinkStatus('${uid}', 'channels', '${key}', '${item.status}')">Toggle Status</button>
                </div>`;
            });
        }
    });
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => alert("Link Copied!"));
}

function toggleLinkStatus(uid, path, key, current) {
    // Admin toggles logic (e.g., mark as 'Added to Slot 1' or 'Pending')
    const next = current === 'Task Added' ? 'Sent to Admin' : 'Task Added';
    rtdb.ref(`userSubmittedLinks/${uid}/${path}/${key}`).update({ status: next });
}

function loadWithdrawRequests() {
    rtdb.ref('withdrawRequests').on('value', snap => {
        const list = document.getElementById("withdrawList"); list.innerHTML = "";
        snap.forEach(child => {
            const r = child.val(); if(r.status==='pending') list.innerHTML += `<tr><td>${r.email}</td><td>Rs ${r.amount}</td><td><button class="btn btn-green" onclick="rtdb.ref('withdrawRequests/${child.key}').update({status:'Approved'})">Approve</button></td></tr>`;
        });
    });
}
</script>
</body>
</html>
