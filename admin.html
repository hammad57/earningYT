<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Admin - Full Control</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --dark: #0f172a; --primary: #1976d2; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7fe; display: flex; margin: 0; }
        #sidebar { width: 240px; background: var(--dark); color: white; height: 100vh; position: fixed; }
        .nav-link { padding: 15px 20px; display: block; color: #cbd5e1; text-decoration: none; border-bottom: 1px solid #1e293b; }
        #main { margin-left: 240px; padding: 20px; width: 100%; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: left; font-size: 13px; }
        .btn { padding: 6px 12px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; font-size: 11px; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }
        input { padding: 5px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div style="padding:20px; font-weight:bold;">SMART ADMIN</div>
    <a href="#tasks" class="nav-link">Platform Tasks</a>
    <a href="#users" class="nav-link">User Management</a>
    <a href="#withdraw" class="nav-link">Withdrawals</a>
</div>

<div id="main">
    <section id="users" class="card">
        <h3>User Management (Balance & History)</h3>
        <table>
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Bonus (Rs)</th>
                    <th>Watch Count</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersList"></tbody>
        </table>
    </section>

    <section id="tasks" class="card">
        <h3>Manage Video Slots</h3>
        <div id="videoSlots" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:10px;"></div>
    </section>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ", authDomain: "own-live-steam-web.firebaseapp.com", projectId: "own-live-steam-web", databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", messagingSenderId: "132045886996", appId: "1:132045886996:web:8a6d937c3548afd2477901" };
firebase.initializeApp(firebaseConfig);
const rtdb = firebase.database(), db = firebase.firestore();

// Load Users with full details
function loadUsers() {
    rtdb.ref('users').on('value', snap => {
        const list = document.getElementById("usersList"); list.innerHTML = "";
        snap.forEach(child => {
            const u = child.val();
            list.innerHTML += `
                <tr>
                    <td>${u.email}</td>
                    <td><input type="number" id="bonus_${child.key}" value="${u.bonus||0}" style="width:60px;"> 
                        <button class="btn btn-blue" onclick="updateBonus('${child.key}')">Set</button></td>
                    <td>${u.watch||0} Videos</td>
                    <td>
                        <button class="btn btn-red" onclick="resetWatch('${child.key}')">Reset Watch</button>
                        <button class="btn btn-red" onclick="deleteUser('${child.key}')">Delete User</button>
                    </td>
                </tr>`;
        });
    });
}

function updateBonus(uid) {
    const val = parseFloat(document.getElementById("bonus_"+uid).value);
    rtdb.ref('users/'+uid).update({bonus: val}).then(()=>alert("Bonus Updated"));
}

function resetWatch(uid) {
    if(confirm("Reset watching history?")) rtdb.ref('users/'+uid).update({watch: 0});
}

function deleteUser(uid) {
    if(confirm("Are you sure? This will delete the user data.")) rtdb.ref('users/'+uid).remove();
}

// Initial Load
loadUsers();
// Task slots logic from previous version can be added here
</script>
</body>
</html>
