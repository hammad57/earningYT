<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Earn - Admin Control Center</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1976d2; --dark: #0f172a; --sidebar-w: 260px; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f4f7fe; display: flex; }
        #sidebar { width: var(--sidebar-w); background: var(--dark); color: white; height: 100vh; position: fixed; z-index: 1000; }
        .nav-link { padding: 15px 25px; display: block; color: #cbd5e1; text-decoration: none; border-bottom: 1px solid #1e293b; }
        #main { flex: 1; margin-left: var(--sidebar-w); padding: 20px; width: calc(100% - var(--sidebar-w)); }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .btn { padding: 8px 15px; border-radius: 6px; cursor: pointer; border: none; font-size: 11px; font-weight: bold; margin: 2px; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .hidden { display: none !important; }
        #modal { position: fixed; top: 10%; left: 30%; width: 50%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 0 50px rgba(0,0,0,0.5); z-index: 2000; }
    </style>
</head>
<body>

<div id="authBox" style="max-width:350px; margin:100px auto; text-align:center; background:white; padding:30px; border-radius:15px;">
    <h2>Admin Access</h2>
    <input type="email" id="aEmail" placeholder="Email" style="width:100%; padding:10px; margin:10px 0;">
    <input type="password" id="aPass" placeholder="Password" style="width:100%; padding:10px; margin:10px 0;">
    <button class="btn btn-green" style="width:100%" onclick="auth.signInWithEmailAndPassword(aEmail.value, aPass.value)">Login</button>
</div>

<div id="adminContent" class="hidden">
    <div id="sidebar">
        <div style="padding:20px; text-align:center; font-weight:bold;">SMART EARN ADMIN</div>
        <a href="#promos" class="nav-link">Promotion Requests</a>
        <a href="#users" class="nav-link">User Management</a>
        <a href="#withdraw" class="nav-link">Withdrawals</a>
        <div style="padding:20px;"><button onclick="auth.signOut()" class="btn btn-red" style="width:100%">Logout</button></div>
    </div>

    <div id="main">
        <div id="promos" class="card">
            <h3>Pending Promotion Orders</h3>
            <table>
                <thead><tr><th>User</th><th>Package</th><th>TRX ID</th><th>Action</th></tr></thead>
                <tbody id="promoList"></tbody>
            </table>
        </div>

        <div id="users" class="card">
            <h3>Manage Users</h3>
            <table>
                <thead><tr><th>Email</th><th>Status</th><th>Links</th><th>Action</th></tr></thead>
                <tbody id="usersList"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal" class="hidden">
    <h3 id="modalTitle">User Content</h3>
    <div id="modalBody" style="max-height:400px; overflow-y:auto; border:1px solid #eee; padding:10px;"></div>
    <button class="btn btn-red" style="margin-top:20px;" onclick="document.getElementById('modal').classList.add('hidden')">Close</button>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ", authDomain: "own-live-steam-web.firebaseapp.com", projectId: "own-live-steam-web", databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", messagingSenderId: "132045886996", appId: "1:132045886996:web:8a6d937c3548afd2477901" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), rtdb = firebase.database();

auth.onAuthStateChanged(u => {
    if(u) {
        document.getElementById("authBox").classList.add("hidden");
        document.getElementById("adminContent").classList.remove("hidden");
        loadPromos(); loadUsers();
    } else {
        document.getElementById("authBox").classList.remove("hidden");
        document.getElementById("adminContent").classList.add("hidden");
    }
});

function loadPromos() {
    rtdb.ref('promotionRequests').on('value', snap => {
        const list = document.getElementById("promoList"); list.innerHTML = "";
        snap.forEach(child => {
            const r = child.val();
            list.innerHTML += `<tr>
                <td>${r.email}</td><td>${r.package}</td><td>${r.trxId}</td>
                <td>
                    <button class="btn btn-green" onclick="approvePromotion('${child.key}', '${r.uid}', '${r.package}')">Approve</button>
                    <button class="btn btn-red" onclick="rtdb.ref('promotionRequests/${child.key}').remove()">Reject</button>
                </td>
            </tr>`;
        });
    });
}

// Approval and Expiry Logic
function approvePromotion(reqKey, uid, pkg) {
    const expiry = new Date(); expiry.setDate(expiry.getDate() + 30);
    const subData = { package: pkg, startDate: new Date().toISOString(), expiryDate: expiry.toISOString(), status: 'active' };
    
    // Save to active and also keep a history record
    rtdb.ref('activeSubscriptions/' + uid).set(subData);
    rtdb.ref('approvedPromotions/' + Date.now()).set({ uid: uid, package: pkg, date: new Date().toLocaleString() });
    
    rtdb.ref('promotionRequests/' + reqKey).remove().then(() => alert("Approved! 30 Days started."));
}

function loadUsers() {
    rtdb.ref('users').on('value', snap => {
        const list = document.getElementById("usersList"); list.innerHTML = "";
        snap.forEach(child => {
            const u = child.val();
            list.innerHTML += `<tr>
                <td>${u.email}</td>
                <td>${u.status}</td>
                <td><button class="btn btn-blue" onclick="viewUserLinks('${child.key}')">View Links</button></td>
                <td><button class="btn btn-red" onclick="rtdb.ref('users/${child.key}').remove()">Delete</button></td>
            </tr>`;
        });
    });
}

// User Links Tracking
function viewUserLinks(uid) {
    const modal = document.getElementById("modal");
    const body = document.getElementById("modalBody");
    modal.classList.remove("hidden");
    body.innerHTML = "Loading...";

    rtdb.ref('userSubmittedLinks/' + uid).on('value', snap => {
        const data = snap.val();
        body.innerHTML = "";
        if(!data) { body.innerHTML = "No links submitted."; return; }

        ['video', 'channel'].forEach(type => {
            if(data[type+'s']) {
                body.innerHTML += `<h4>${type.toUpperCase()}S:</h4>`;
                Object.keys(data[type+'s']).forEach(key => {
                    const item = data[type+'s'][key];
                    body.innerHTML += `<div style="padding:10px; border:1px solid #eee; margin-bottom:5px;">
                        <p style="margin:0; font-size:12px;">${item.url}</p>
                        <button class="btn ${item.status==='Task Added' ? 'btn-red':'btn-green'}" 
                                onclick="toggleTaskStatus('${uid}', '${type}s', '${key}', '${item.status}')">
                            ${item.status === 'Task Added' ? 'Mark Pending' : 'Mark Task Added'}
                        </button>
                    </div>`;
                });
            }
        });
    });
}

function toggleTaskStatus(uid, path, key, current) {
    const next = current === 'Task Added' ? 'pending' : 'Task Added';
    rtdb.ref(`userSubmittedLinks/${uid}/${path}/${key}`).update({ status: next });
}
</script>
</body>
</html>
