<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Earn - Professional Earning Platform</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #1976d2; --dark: #0f172a; --success: #28a745; --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg-gradient); color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }
        
        /* Sidebar Restored */
        #sidebar { width: 280px; background: #1e293b; color: white; height: 100vh; padding: 20px; position: fixed; left: -280px; top: 0; box-sizing: border-box; overflow-y: auto; z-index: 2000; transition: 0.3s ease-in-out; border-right: 1px solid #334155; }
        #sidebar.open { left: 0; }
        .sidebar-link { display: block; padding: 12px; color: #60a5fa; text-decoration: none; border-bottom: 1px solid #334155; font-weight: bold; cursor: pointer; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1999; }
        #overlay.active { display: block; }

        /* UI Elements */
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .btn-main { background: #ffc107; color: #333; padding: 15px 40px; border-radius: 50px; text-decoration: none; font-weight: bold; cursor: pointer; border:none; }
        .hidden { display: none !important; }
        
        /* Fixed Promo Link Style */
        #myPromoLink { 
            display: none; 
            background: linear-gradient(45deg, #ffd700, #ffa500); 
            color: #000 !important; 
            border-radius: 8px; 
            margin-top: 15px; 
            text-align: center;
        }

        .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleMenu()"></div>

<div id="sidebar">
    <h3 style="color: #60a5fa;">Smart Earn</h3>
    <div id="displayEmail" style="font-size:12px; color:#94a3b8; margin-bottom:10px;">Guest</div>
    <div style="font-size:20px; font-weight:bold; color:#28a745;">Rs <span id="totalBalance">0.00</span></div>
    <hr style="border:0.5px solid #334155;">
    
    <a class="sidebar-link" onclick="location.reload()">Dashboard</a>
    <a class="sidebar-link" onclick="openPromoTab()">Buy Promotion</a>
    
    <a class="sidebar-link" id="myPromoLink" onclick="showPromoHub()"><i class="fas fa-video"></i> MY PROMOTION HUB</a>
    
    <a class="sidebar-link" onclick="applyWithdraw()">Withdraw</a>
    <button onclick="auth.signOut()" style="width:100%; margin-top:20px; background:#ef4444; color:white; border:none; padding:10px; border-radius:5px;">Logout</button>
</div>

<div id="landingPage">
    <div style="text-align:center; padding:100px 20px;">
        <h1>Professional Earning</h1>
        <a href="#pkgSection" class="btn-main">View Packages</a>
    </div>
    <div id="pkgSection" style="padding:20px;">
        <div class="card" style="text-align:center;">
            <h3>Gold - Rs 300</h3>
            <button onclick="openPromo('Gold Monthly Package', 300)">Buy Now</button>
        </div>
        <div id="authBox" class="card" style="max-width:400px; margin:auto;">
            <input id="lEmail" type="email" placeholder="Email" style="width:100%; padding:10px; margin:5px 0;">
            <input id="lPass" type="password" placeholder="Password" style="width:100%; padding:10px; margin:5px 0;">
            <button onclick="handleLogin()" style="width:100%; padding:10px; background:var(--primary); color:white; border:none;">Login</button>
        </div>
    </div>
</div>

<div id="dashboard" class="hidden">
    <div style="padding:15px; background:#1e293b; display:flex; justify-content:space-between;">
        <button onclick="toggleMenu()" style="background:none; border:none; color:white; font-size:20px;">☰</button>
        <div id="userBalanceHead">Rs 0.00</div>
    </div>
    <div id="taskList" style="padding:20px;"></div>
</div>

<div id="promoHub" class="hidden" style="padding:20px;">
    <div class="card">
        <h2 style="color:#ffd700;">My Promotion Hub</h2>
        <div id="subInfo" style="margin-bottom:15px; font-size:14px;"></div>
        <input type="text" id="vLinkInput" placeholder="Paste Video Link" style="width:100%; padding:10px; margin-bottom:10px;">
        <button onclick="submitUserContent('video')" style="width:100%; padding:10px; background:#28a745; color:white; border:none;">Submit Video</button>
        
        <div id="channelInputSection" class="hidden" style="margin-top:10px;">
            <input type="text" id="cLinkInput" placeholder="Paste Channel Link" style="width:100%; padding:10px; margin-bottom:10px;">
            <button onclick="submitUserContent('channel')" style="width:100%; padding:10px; background:#00d2ff; color:black; border:none;">Submit Channel</button>
        </div>
        
        <h4 style="margin-top:20px;">My Submissions:</h4>
        <div id="userLinksList" style="font-size:12px; opacity:0.8;"></div>
    </div>
    <button onclick="closePromoHub()" style="width:100%; padding:10px;">Back</button>
</div>

<div class="popup" id="promoPopup">
    <div class="card" style="width:90%; max-width:400px;">
        <h3 id="promoTitle"></h3>
        <p>Send Rs <span id="promoPrice"></span> to Easypaisa: 03423944508</p>
        <input id="promoTrx" placeholder="Transaction ID" style="width:100%; padding:10px; margin:5px 0;">
        <button onclick="submitPromo()" style="width:100%; padding:10px; background:var(--success); color:white; border:none;">Confirm Payment</button>
        <button onclick="document.getElementById('promoPopup').style.display='none'" style="background:none; border:none; color:white; margin-top:10px;">Cancel</button>
    </div>
</div>

<div class="popup" id="videoPopup"><div id="timerDisplay" style="color:#ffeb3b; font-size:24px;">18s</div><div id="player"></div></div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ", authDomain: "own-live-steam-web.firebaseapp.com", projectId: "own-live-steam-web", databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", messagingSenderId: "132045886996", appId: "1:132045886996:web:8a6d937c3548afd2477901" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), rtdb = firebase.database();

let userDataGlobal = null, currentSlot = "";

function toggleMenu() { document.getElementById("sidebar").classList.toggle("open"); document.getElementById("overlay").classList.toggle("active"); }

auth.onAuthStateChanged(u => {
    if(u){
        document.getElementById("landingPage").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        document.getElementById("displayEmail").innerText = u.email;
        
        // Real-time user data
        rtdb.ref('users/'+u.uid).on('value', s => {
            userDataGlobal = s.val() || {};
            const bal = ((userDataGlobal.watch||0)*0.38 + (userDataGlobal.subPoints||0)*0.60 + (userDataGlobal.bonus||0) - (userDataGlobal.withdrawnAmount||0)).toFixed(2);
            document.getElementById("totalBalance").innerText = bal;
            document.getElementById("userBalanceHead").innerText = "Rs " + bal;
            loadTasks();
        });

        // FIX: Subscription Listener
        rtdb.ref('activeSubscriptions/' + u.uid).on('value', snap => {
            const sub = snap.val();
            const btn = document.getElementById("myPromoLink");
            if(sub) {
                btn.style.display = "block"; // Show button if data exists
                document.getElementById("subInfo").innerText = "Plan: " + sub.package + " | Expiry: " + sub.expiryDate;
                if(sub.package.includes("Premium")) document.getElementById("channelInputSection").classList.remove("hidden");
                loadUserHistory(u.uid);
            } else {
                btn.style.display = "none";
            }
        });

    } else {
        document.getElementById("landingPage").classList.remove("hidden");
        document.getElementById("dashboard").classList.add("hidden");
    }
});

function handleLogin() { auth.signInWithEmailAndPassword(lEmail.value, lPass.value).catch(e => alert(e.message)); }

async function loadTasks() {
    const list = document.getElementById("taskList"); list.innerHTML = "";
    const vS = await db.collection("videos").get();
    const completed = (userDataGlobal.completed || "").split(",");
    vS.forEach(doc => {
        const v = doc.data();
        if(v.enabled && !completed.includes("slot"+v.slot)) {
            list.innerHTML += `<div class="card" style="display:flex; justify-content:space-between;">Video Task ${v.slot} <button onclick="playVideo('${v.link}', 'slot${v.slot}')" style="width:auto; padding:5px 15px;">Watch</button></div>`;
        }
    });
}

function showPromoHub() { toggleMenu(); document.getElementById("dashboard").classList.add("hidden"); document.getElementById("promoHub").classList.remove("hidden"); }
function closePromoHub() { document.getElementById("promoHub").classList.add("hidden"); document.getElementById("dashboard").classList.remove("hidden"); }
function openPromoTab() { toggleMenu(); window.scrollTo(0, document.getElementById("pkgSection").offsetTop); }
function openPromo(p, pr) { if(!auth.currentUser) return alert("Login First"); promoTitle.innerText = p; promoPrice.innerText = pr; document.getElementById("promoPopup").style.display = "flex"; }

function submitPromo() {
    rtdb.ref('promotionRequests').push({
        uid: auth.currentUser.uid,
        email: auth.currentUser.email,
        package: promoTitle.innerText,
        trx: promoTrx.value,
        status: 'pending'
    }).then(() => { alert("Request Sent!"); document.getElementById("promoPopup").style.display = "none"; });
}

function submitUserContent(type) {
    const val = type === 'video' ? vLinkInput.value : cLinkInput.value;
    if(!val) return;
    rtdb.ref(`userSubmittedLinks/${auth.currentUser.uid}/${type}s`).push({ url: val, status: 'pending' })
    .then(() => { alert("Submitted!"); vLinkInput.value = ""; cLinkInput.value = ""; });
}

function loadUserHistory(uid) {
    rtdb.ref('userSubmittedLinks/' + uid).on('value', snap => {
        const div = document.getElementById("userLinksList"); div.innerHTML = "";
        snap.forEach(child => {
            Object.values(child.val()).forEach(item => {
                div.innerHTML += `<div style="border-bottom:1px solid #334155; padding:5px;">${item.url} - <span style="color:#ffd700">${item.status}</span></div>`;
            });
        });
    });
}

let player, vTime, watchTimer;
function playVideo(url, sid) {
    currentSlot = sid; vTime = 18; document.getElementById("videoPopup").style.display = "flex";
    const vidId = url.split('v=')[1]?.split('&')[0];
    if(player) player.loadVideoById(vidId);
    else player = new YT.Player('player', { height: '200', width: '100%', videoId: vidId, events: { 'onStateChange': e => { if(e.data == 1) startT(); } } });
}
function startT() {
    clearInterval(watchTimer);
    watchTimer = setInterval(() => {
        vTime--; timerDisplay.innerText = vTime+"s";
        if(vTime <= 0) {
            clearInterval(watchTimer);
            rtdb.ref('users/'+auth.currentUser.uid).update({
                watch: (userDataGlobal.watch || 0) + 1,
                completed: (userDataGlobal.completed || "") + "," + currentSlot
            });
            document.getElementById("videoPopup").style.display = "none";
            player.stopVideo();
        }
    }, 1000);
}
</script>
</body>
</html>
