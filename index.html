<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Earn - Professional Platform</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #1976d2; --dark: #0f172a; --success: #28a745; --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg-gradient); color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }
        #sidebar { width: 280px; background: #1e293b; color: white; height: 100vh; padding: 20px; position: fixed; left: -280px; top: 0; box-sizing: border-box; overflow-y: auto; z-index: 2000; transition: 0.3s ease-in-out; border-right: 1px solid #334155; }
        #sidebar.open { left: 0; }
        .sidebar-link { display: block; padding: 12px; color: #60a5fa; text-decoration: none; border-bottom: 1px solid #334155; font-weight: bold; cursor: pointer; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1999; }
        #overlay.active { display: block; }
        .btn-main { background: #ffc107; color: #333; padding: 15px 40px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 1.1rem; display: inline-block; transition: 0.3s; cursor: pointer; border:none; text-align: center; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .section-title { text-align: center; margin: 50px 0 30px; font-size: 2rem; color: #60a5fa; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .hidden { display: none !important; }
        .top-bar { background: #1e293b; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; border: none; background: var(--primary); color: white; }
        .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        /* Special Golden Link Style */
        #myPromoLink { background: linear-gradient(45deg, #ffd700, #b8860b); color: #000 !important; border: none; display: none; margin-top: 15px; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3); }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleMenu()"></div>
<div id="sidebar">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="color: #60a5fa; margin: 0;">Profile</h3>
        <button onclick="toggleMenu()" style="width: auto; background: none; color: white; font-size: 20px;">×</button>
    </div>
    <hr style="border: 0.5px solid #334155; margin: 15px 0;">
    <div id="displayEmail" style="font-size:12px; color:#94a3b8">Guest</div>
    <div style="font-size:22px; font-weight:bold; color:#28a745; margin-bottom: 15px;">Rs <span id="totalBalance">0.00</span></div>
    
    <a class="sidebar-link" onclick="openPromoTab()"><i class="fas fa-rocket"></i> Buy Promotion</a>
    
    <a class="sidebar-link" id="myPromoLink" onclick="showPromoHub()"><i class="fas fa-star"></i> MY PROMOTION HUB</a>
    
    <button onclick="applyWithdraw()" style="background:#28a745; margin-top:20px;">Withdraw</button>
    <button onclick="auth.signOut()" style="background:#ef4444; margin-top: 20px;">Sign Out</button>
</div>

<div id="landingPage">
    <div class="hero" style="text-align: center; padding: 80px 20px;">
        <h1>Smart Earn</h1>
        <p>Boost Your YouTube Journey</p>
        <a href="#pkgSection" class="btn-main">Get Started</a>
    </div>
    <div id="pkgSection" class="container">
        <div class="card" style="text-align:center;">
            <h3>Gold Package - Rs 300</h3>
            <button onclick="openPromo('Gold Monthly Package', 300)">Buy Now</button>
        </div>
        <div class="card" style="text-align:center;">
            <h3>Premium Package - Rs 500</h3>
            <button onclick="openPromo('Premium Monthly Package', 500)">Buy Now</button>
        </div>
        <div id="authBox" class="card" style="max-width: 400px; margin: 50px auto;">
            <input id="lEmail" placeholder="Email"><input id="lPass" type="password" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
            <button onclick="handleRegister()" style="background:#334155; margin-top:10px;">Register</button>
        </div>
    </div>
</div>

<div id="dashboard" class="hidden">
    <div class="top-bar">
        <button onclick="toggleMenu()" style="background:none; width:auto; font-size:22px;">☰</button>
        <div id="userBalanceHead" style="color:#28a745; font-weight:bold;">Rs 0.00</div>
    </div>
    <div class="container">
        <div class="card" id="taskList">Loading...</div>
    </div>
</div>

<div id="promoHub" class="hidden container">
    <div class="card">
        <h2 style="color:#ffd700;">Active Promotion Hub</h2>
        <div id="subInfo" style="padding:10px; background:#0f172a; margin-bottom:10px; border-radius:5px;"></div>
        <input type="text" id="vLinkInput" placeholder="Video Link">
        <button onclick="submitUserContent('video')">Submit Video</button>
        <div id="channelInputSection" class="hidden">
            <input type="text" id="cLinkInput" placeholder="Channel Link" style="margin-top:10px;">
            <button onclick="submitUserContent('channel')" style="background:#00d2ff; color:#000;">Submit Channel</button>
        </div>
        <h4 style="margin-top:20px;">History:</h4>
        <div id="userLinksList" style="font-size:12px;"></div>
    </div>
    <button onclick="closePromoHub()">Close</button>
</div>

<div class="popup" id="promoPopup">
    <div class="card" style="width:90%; max-width:400px;">
        <h3 id="promoTitle"></h3>
        <p>Pay to: 0342-3944508</p>
        <input id="promoTrx" placeholder="TRX ID"><input id="promoLink" placeholder="Channel Link">
        <button onclick="submitPromo()">Submit Order</button>
        <button onclick="document.getElementById('promoPopup').style.display='none'" style="background:none;">Cancel</button>
    </div>
</div>

<div class="popup" id="videoPopup"><div id="timerDisplay" style="color:#ffeb3b; font-size:24px;">18s</div><div id="player"></div></div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ", authDomain: "own-live-steam-web.firebaseapp.com", projectId: "own-live-steam-web", databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", messagingSenderId: "132045886996", appId: "1:132045886996:web:8a6d937c3548afd2477901" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), rtdb = firebase.database();

function toggleMenu() { document.getElementById("sidebar").classList.toggle("open"); document.getElementById("overlay").classList.toggle("active"); }

function handleLogin() { auth.signInWithEmailAndPassword(lEmail.value, lPass.value).catch(e => alert(e.message)); }
function handleRegister() { auth.createUserWithEmailAndPassword(rEmail.value, rPass.value).then(c => { rtdb.ref('users/'+c.user.uid).set({email:rEmail.value, watch:0, subPoints:0, bonus:0, withdrawnAmount:0}); }); }

auth.onAuthStateChanged(u => {
    if(u){
        document.getElementById("landingPage").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        document.getElementById("displayEmail").innerText = u.email;
        
        // Listener 1: User Data
        rtdb.ref('users/'+u.uid).on('value', s => { 
            const d = s.val(); 
            if(d) document.getElementById("totalBalance").innerText = ((d.watch||0)*0.38 + (d.subPoints||0)*0.60 + (d.bonus||0) - (d.withdrawnAmount||0)).toFixed(2);
        });

        // Listener 2: Subscription (CRITICAL FIX)
        // Hum pure 'activeSubscriptions' node ko listen kar rahe hain user ID ke liye
        rtdb.ref('activeSubscriptions/' + u.uid).on('value', snap => {
            const promoBtn = document.getElementById("myPromoLink");
            const sub = snap.val();
            
            if(sub && sub.status === 'active') {
                const expiry = new Date(sub.expiryDate);
                if(expiry > new Date()) {
                    promoBtn.style.setProperty('display', 'block', 'important'); // Forced show
                    document.getElementById("subInfo").innerHTML = `<b>Plan:</b> ${sub.package} <br> <b>Expires:</b> ${expiry.toLocaleDateString()}`;
                    document.getElementById("channelInputSection").classList.toggle("hidden", !sub.package.includes("Premium"));
                    loadUserSubmittedLinks(u.uid);
                } else {
                    promoBtn.style.display = "none";
                }
            } else {
                promoBtn.style.display = "none";
            }
        });
        loadTasks();
    } else {
        document.getElementById("landingPage").classList.remove("hidden");
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("myPromoLink").style.display = "none";
    }
});

async function loadTasks() {
    const list = document.getElementById("taskList"); list.innerHTML = "";
    const vS = await db.collection("videos").get();
    vS.forEach(doc => { const v = doc.data(); if(v.enabled) list.innerHTML += `<div class="card" style="display:flex; justify-content:space-between;">Video Task ${v.slot} <button onclick="playVideo('${v.link}')" style="width:auto">Watch</button></div>`; });
}

function showPromoHub() { 
    toggleMenu(); 
    document.getElementById("dashboard").classList.add("hidden"); 
    document.getElementById("promoHub").classList.remove("hidden"); 
}

function closePromoHub() { 
    document.getElementById("promoHub").classList.add("hidden"); 
    document.getElementById("dashboard").classList.remove("hidden"); 
}

function openPromoTab() { toggleMenu(); window.scrollTo(0, document.getElementById("pkgSection").offsetTop); }
function openPromo(p, pr) { if(!auth.currentUser) return alert("Login first"); promoTitle.innerText=p; promoPopup.style.display='flex'; }
function submitPromo() { rtdb.ref('promotionRequests').push({uid:auth.currentUser.uid, email:auth.currentUser.email, trxId:promoTrx.value, package:promoTitle.innerText, status:'pending'}).then(()=>alert("Pending Approval")); promoPopup.style.display='none'; }

function submitUserContent(type) {
    const input = type === 'video' ? document.getElementById("vLinkInput") : document.getElementById("cLinkInput");
    if(!input.value) return;
    rtdb.ref(`userSubmittedLinks/${auth.currentUser.uid}/${type}s`).push({ url: input.value, status: 'pending' }).then(() => { input.value = ""; alert("Submitted!"); });
}

function loadUserSubmittedLinks(uid) {
    rtdb.ref('userSubmittedLinks/' + uid).on('value', snap => {
        const list = document.getElementById("userLinksList"); list.innerHTML = "";
        if(!snap.exists()) return;
        snap.forEach(child => {
            Object.values(child.val()).forEach(item => {
                list.innerHTML += `<div style="padding:5px; border-bottom:1px solid #334155;">${item.url} - [${item.status}]</div>`;
            });
        });
    });
}

// Player logic
let player, vTime, watchTimer;
function playVideo(u) { document.getElementById("videoPopup").style.display = "flex"; vTime = 18; const id = u.split('v=')[1]?.split('&')[0]; if(player) player.loadVideoById(id); else player = new YT.Player('player', { height: '200', width: '100%', videoId: id, events: { 'onStateChange': e => { if(e.data == 1) startT(); } } }); }
function startT() { clearInterval(watchTimer); watchTimer = setInterval(() => { vTime--; timerDisplay.innerText = vTime+"s"; if(vTime<=0){ clearInterval(watchTimer); rtdb.ref('users/'+auth.currentUser.uid).once('value', s => { rtdb.ref('users/'+auth.currentUser.uid).update({watch: (s.val().watch||0)+1}); videoPopup.style.display='none'; player.stopVideo(); }); } }, 1000); }
</script>
</body>
</html>
