<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Earn - Professional Earning Platform</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #1976d2; --dark: #0f172a; --success: #28a745; --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg-gradient); color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }
        #sidebar { width: 280px; background: #1e293b; color: white; height: 100vh; padding: 20px; position: fixed; left: -280px; top: 0; box-sizing: border-box; overflow-y: auto; z-index: 2000; transition: 0.3s ease-in-out; border-right: 1px solid #334155; }
        #sidebar.open { left: 0; }
        .sidebar-link { display: block; padding: 12px; color: #60a5fa; text-decoration: none; border-bottom: 1px solid #334155; font-weight: bold; cursor: pointer; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1999; }
        #overlay.active { display: block; }
        .btn-main { background: #ffc107; color: #333; padding: 15px 40px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 1.1rem; display: inline-block; transition: 0.3s; cursor: pointer; border:none; text-align: center; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .hidden { display: none !important; }
        .top-bar { background: #1e293b; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
        .stat-box { background: #334155; padding: 15px; border-radius: 10px; flex: 1; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; border: none; background: var(--primary); color: white; }
        .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleMenu()"></div>
<div id="sidebar">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="color: #60a5fa; margin: 0;">Account Profile</h3>
        <button onclick="toggleMenu()" style="width: auto; background: none; color: white; font-size: 20px;">×</button>
    </div>
    <hr style="border: 0.5px solid #334155; margin: 15px 0;">
    <div id="sidebarUserInfo">
        <div id="displayEmail" style="font-size:13px; margin-bottom:10px; color:#94a3b8">Guest</div>
        <div style="font-size:22px; font-weight:bold; color:#28a745">Rs <span id="totalBalance">0.00</span></div>
    </div>

    <a class="sidebar-link" onclick="openPromoTab()"><i class="fas fa-rocket"></i> Get Subscription</a>
    <a class="sidebar-link" onclick="openViralPopup()" style="color: #ff4444;"><i class="fab fa-youtube"></i> Submit Viral Videos</a>
    
    <button onclick="applyWithdraw()" style="background:#28a745; margin-top:15px;">Withdraw Now</button>
    <button onclick="auth.signOut()" style="background:#ef4444; margin-top: 30px;">Sign Out</button>
</div>

<div id="dashboard" class="hidden">
    <div class="top-bar">
        <button onclick="toggleMenu()" style="background:none; width:auto; font-size:22px;">☰</button>
        <div style="font-weight: bold; color: #60a5fa;">Member Dashboard</div>
        <div id="userBalanceHead" style="color:#28a745; font-weight:bold;">Rs 0.00</div>
    </div>
    <div class="container">
        <div class="card">
            <div style="display:flex; gap: 10px;">
                <div class="stat-box"><strong>Balance</strong><br>Rs <span id="mainBal">0</span></div>
            </div>
        </div>
        <div id="taskList">Loading Tasks...</div>
    </div>
</div>

<div id="landingPage">
    <div class="container" id="pkgSection">
        <h2 style="text-align:center; color:#60a5fa;">Our Packages</h2>
        <div class="card" style="text-align:center;">
            <h3>Gold Package</h3>
            <p>Price: 300 PKR</p>
            <button onclick="openPromo('Gold', 300)">Buy Now</button>
        </div>
        <div class="card" style="text-align:center;">
            <h3>Premium Package</h3>
            <p>Price: 500 PKR</p>
            <button onclick="openPromo('Premium', 500)">Buy Now</button>
        </div>
        
        <div id="authBox" class="card" style="max-width: 400px; margin: 20px auto;">
             <input id="lEmail" placeholder="Email"><input id="lPass" type="password" placeholder="Password"><button onclick="handleLogin()">Login</button>
        </div>
    </div>
</div>

<div class="popup" id="viralPopup">
    <div class="card" style="width:90%; max-width:500px;">
        <h3 style="color:#ff4444; text-align:center;">Submit 5 Viral Videos</h3>
        <input id="vl1" placeholder="Video Link 1">
        <input id="vl2" placeholder="Video Link 2">
        <input id="vl3" placeholder="Video Link 3">
        <input id="vl4" placeholder="Video Link 4">
        <input id="vl5" placeholder="Video Link 5">
        <button onclick="submitViralLinks()" style="background:#28a745;">Send to Admin</button>
        <button onclick="document.getElementById('viralPopup').style.display='none'" style="background:none;">Cancel</button>
    </div>
</div>

<div class="popup" id="promoPopup">
    <div class="card" style="width:90%; max-width:450px;">
        <h3 id="promoTitle">Subscription</h3>
        <p>Easypaisa: 0342-3944508</p>
        <input id="promoLink" placeholder="Channel/Video Link">
        <input id="promoTrx" placeholder="Transaction ID">
        <button onclick="submitPromo()" style="background:#28a745;">Submit Order</button>
        <button onclick="document.getElementById('promoPopup').style.display='none'" style="background:none;">Close</button>
    </div>
</div>

<div class="popup" id="videoPopup"><div id="timerDisplay" style="color:#ffeb3b; font-size:24px;">18s</div><div id="player"></div></div>

<script>
const firebaseConfig = { apiKey: "AIzaSyCbJantLTt7-Ifp6fTaf8vHBu-8rLVrlLQ", authDomain: "own-live-steam-web.firebaseapp.com", projectId: "own-live-steam-web", databaseURL: "https://own-live-steam-web-default-rtdb.firebaseio.com", messagingSenderId: "132045886996", appId: "1:132045886996:web:8a6d937c3548afd2477901" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), rtdb = firebase.database();

auth.onAuthStateChanged(u => {
    if(u){
        document.getElementById("landingPage").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        document.getElementById("displayEmail").innerText = u.email;
        rtdb.ref('users/'+u.uid).on('value', s => { 
            let d = s.val(); 
            if(d) {
                let bal = ((d.watch||0)*0.38) + (d.bonus||0);
                document.getElementById("totalBalance").innerText = bal.toFixed(2);
                document.getElementById("userBalanceHead").innerText = "Rs " + bal.toFixed(2);
                document.getElementById("mainBal").innerText = bal.toFixed(2);
            }
        });
        loadTasks();
    } else {
        document.getElementById("landingPage").classList.remove("hidden");
        document.getElementById("dashboard").classList.add("hidden");
    }
});

function handleLogin() { auth.signInWithEmailAndPassword(lEmail.value, lPass.value).catch(e => alert(e.message)); }
function toggleMenu() { document.getElementById("sidebar").classList.toggle("open"); document.getElementById("overlay").classList.toggle("active"); }

function openViralPopup() { toggleMenu(); document.getElementById("viralPopup").style.display = "flex"; }

function submitViralLinks() {
    const links = [vl1.value, vl2.value, vl3.value, vl4.value, vl5.value].filter(l => l !== "");
    if(links.length === 0) return alert("Kam az kam ek link dalain");
    
    rtdb.ref('viralRequests').push({
        uid: auth.currentUser.uid,
        email: auth.currentUser.email,
        links: links,
        timestamp: Date.now()
    }).then(() => {
        alert("Sent to admin!");
        document.getElementById("viralPopup").style.display = "none";
    });
}

function openPromoTab() { toggleMenu(); document.getElementById("dashboard").classList.add("hidden"); document.getElementById("landingPage").classList.remove("hidden"); }
function openPromo(p, pr) { if(!auth.currentUser) return alert("Login first"); promoTitle.innerText=p; promoPopup.style.display='flex'; }
function submitPromo() {
    rtdb.ref('promotionRequests').push({uid:auth.currentUser.uid, email:auth.currentUser.email, link:promoLink.value, trxId:promoTrx.value, package:promoTitle.innerText}).then(()=>alert("Request Sent!"));
    promoPopup.style.display='none';
}

async function loadTasks() {
    const list = document.getElementById("taskList"); list.innerHTML = "";
    const vS = await db.collection("videos").get();
    vS.forEach(doc => { const v = doc.data(); list.innerHTML += `<div class="card">Task ${v.slot} <button onclick="playVideo('${v.link}')" style="width:auto; float:right;">Watch</button></div>`; });
}

let player, vTime, watchTimer;
function playVideo(u) { document.getElementById("videoPopup").style.display = "flex"; vTime = 18; const id = u.split('v=')[1]?.split('&')[0]; if(player) player.loadVideoById(id); else player = new YT.Player('player', { height: '250', width: '100%', videoId: id, events: { 'onStateChange': e => { if(e.data == 1) startT(); } } }); }
function startT() { clearInterval(watchTimer); watchTimer = setInterval(() => { vTime--; timerDisplay.innerText = vTime+"s"; if(vTime<=0){ clearInterval(watchTimer); rtdb.ref('users/'+auth.currentUser.uid).once('value', s => { rtdb.ref('users/'+auth.currentUser.uid).update({watch: (s.val().watch||0)+1}); videoPopup.style.display='none'; player.stopVideo(); }); } }, 1000); }
</script>
</body>
</html>
